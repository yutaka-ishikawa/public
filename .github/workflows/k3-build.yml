name: K3 fork build validation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/k3-build.yml'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git make build-essential python3 meson ninja-build pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev libslirp-dev zlib1g-dev device-tree-compiler libcapstone-dev
      - name: Checkout patched QEMU fork
        run: |
          git clone --filter=blob:none --branch k3-patched-20261107 https://github.com/yutaka-ishikawa/qemu.git qemu
          git -C qemu fetch --no-tags https://github.com/qemu/qemu.git refs/tags/v11.1.3
          test "$(git -C qemu rev-parse HEAD^)" = "$(git -C qemu rev-parse FETCH_HEAD^{} )"
          git -C qemu log -1 --oneline
      - name: Build patched QEMU and verify machine
        run: |
          set -Eeuo pipefail
          cd qemu
          ./configure --target-list=riscv64-softmmu --enable-tcg --disable-docs --disable-werror
          ninja -C build qemu-system-riscv64
          ./build/qemu-system-riscv64 -machine help | tee "$GITHUB_WORKSPACE/qemu-machines.txt"
          grep -i jupiter2 "$GITHUB_WORKSPACE/qemu-machines.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-jupiter2-diagnostics
          path: qemu-machines.txt
          if-no-files-found: warn
  opensbi-keystone:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install RISC-V build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y git make build-essential python3 clang lld llvm binutils
      - name: Checkout patched forks and verify base
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --branch k3-patched-20261107 https://github.com/yutaka-ishikawa/opensbi.git opensbi-k3
          git clone --filter=blob:none --branch k3-patched-20261107 https://github.com/yutaka-ishikawa/keystone.git keystone
          test "$(git -C opensbi-k3 rev-parse HEAD^)" = ad6091fd16c4d4a445168f6a479e1b8aadb4931c
          test "$(git -C keystone rev-parse HEAD^)" = b8c2385355b2afb5b94a4e5dc503936f1502b972
      - name: Check patched build environment
        run: bash scripts/check_build_environment.sh "$GITHUB_WORKSPACE/keystone" "$GITHUB_WORKSPACE/opensbi-k3"
      - name: Build SM object
        run: bash scripts/build_keystone_sm.sh "$GITHUB_WORKSPACE/keystone" "$GITHUB_WORKSPACE/opensbi-k3" "$GITHUB_WORKSPACE/work"
      - name: Link OpenSBI firmware
        run: bash scripts/build_opensbi_link.sh "$GITHUB_WORKSPACE/opensbi-k3" "$GITHUB_WORKSPACE/work"
      - name: Archive diagnostic logs and firmware
        if: always()
        shell: bash
        run: |
          mkdir -p ci-output
          find work -maxdepth 1 -type f \( -name '*.log' -o -name '*.txt' \) -exec cp {} ci-output/ \; 2>/dev/null || true
          if test -s work/sm-combined.o; then cp work/sm-combined.o ci-output/; fi
          F=work/build-opensbi-k3-keystone/platform/generic/firmware
          for ext in bin elf; do if test -s "$F/fw_dynamic.$ext"; then cp "$F/fw_dynamic.$ext" ci-output/; fi; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opensbi-keystone-diagnostics
          path: ci-output/
          if-no-files-found: warn
