name: K3 integration script validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-install-k3.sh'
      - 'scripts/build-rootfs-k3.sh'
      - 'scripts/build-install-keystone.sh'
      - 'scripts/build-keystone-guest-tools.sh'
      - 'scripts/install-keystone-guest-tools.sh'
      - 'scripts/guest/**'
      - 'scripts/tests/test-keystone-guest-tools.py'
      - 'scripts/tests/test-keystone-sm-port.py'
      - 'scripts/tests/test-keystone-timer-policy.py'
      - 'keystone/sm/src/**'
      - 'keystone/sm/tools/**'
      - 'scripts/build_keystone_sm.sh'
      - 'opensbi/Makefile'
      - 'opensbi/platform/generic/spacemit/**'
      - 'opensbi/platform/generic/include/spacemit/k3_keystone_timer.h'
      - 'scripts/build-rootfs-keystone.sh'
      - 'scripts/install-build-deps.sh'
      - 'scripts/tests/test-rootfs-k3.py'
      - 'scripts/tests/test-build-rootfs-k3.py'
      - 'keystone/runtime/sys/entry.S'
      - 'keystone/runtime/CMakeLists.txt'
      - 'keystone/runtime/loader-binary/**'
      - 'scripts/tests/test-keystone-loader-entry.py'
      - 'scripts/tests/keystone-loader-entry-check.c'
      - 'keystone/sdk/src/edge/CMakeLists.txt'
      - 'keystone/sdk/src/app/CMakeLists.txt'
      - 'keystone/examples/hello-native/CMakeLists.txt'
      - 'keystone/sdk/macros.cmake'
      - 'run-k3.sh'
      - 'scripts/run-k3.sh'
      - 'scripts/clean-k3.sh'
      - '.github/workflows/validate-k3-scripts.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/clean-k3.sh
          bash -n scripts/build-install-k3.sh
          bash -n scripts/build-rootfs-k3.sh
          bash -n scripts/build-install-keystone.sh
          bash -n scripts/build-keystone-guest-tools.sh
          bash -n scripts/install-keystone-guest-tools.sh
          for helper in scripts/guest/*; do bash -n "$helper"; done
          bash -n scripts/build-rootfs-keystone.sh
          bash -n scripts/install-build-deps.sh
          bash -n run-k3.sh
          bash -n scripts/run-k3.sh
          bash -n scripts/build-linux-k3.sh
          bash -n scripts/build_keystone_sm.sh
          bash -n scripts/build_opensbi_link.sh
      - name: Install image test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs fakeroot libfdt-dev
      - name: Verify Keystone SM trap and timer contracts
        run: |
          python3 scripts/tests/test-keystone-sm-port.py
          python3 scripts/tests/test-keystone-timer-policy.py
      - name: Verify image creation and Keystone overlay
        run: python3 scripts/tests/test-build-rootfs-k3.py
      - name: Verify guest helper installation and shutdown control
        run: python3 scripts/tests/test-keystone-guest-tools.py
      - name: Verify rootfs selection and data preservation
        run: python3 scripts/tests/test-rootfs-k3.py
      - name: Install SDK test tools
        run: |
          sudo apt-get install -y cmake makeself g++-riscv64-linux-gnu qemu-user
      - name: Build examples with distro-style stack protection enabled
        env:
          CFLAGS: -fstack-protector-all -fPIE
          CXXFLAGS: -fstack-protector-all -fPIE
        run: bash scripts/build-install-keystone.sh --only sdk --jobs 2
      - name: Execute relocated enclave loader entry and reject unsupported GOT
        run: python3 scripts/tests/test-keystone-loader-entry.py
      - name: Verify Eyrie entry layout with build-id generation
        run: python3 scripts/tests/test-keystone-runtime-entry.py
      - name: Build and exercise static guest module loader
        run: |
          set -euo pipefail
          bash scripts/build-keystone-guest-tools.sh
          qemu-riscv64 .build-keystone/guest-tools/busybox --list > /tmp/keystone-applets
          for applet in insmod lsmod mount mountpoint sync poweroff reboot; do
            grep -x "$applet" /tmp/keystone-applets
          done
          if qemu-riscv64 .build-keystone/guest-tools/busybox insmod /nonexistent-keystone-test.ko; then
            exit 1
          fi
      - name: Build trace-enabled SM and OpenSBI firmware
        run: |
          sudo apt-get install -y clang lld llvm
          KEYSTONE_SM_TRACE=1 bash scripts/build-install-k3.sh --only firmware --prefix /tmp/keystone-firmware-test --jobs 2
          strings /tmp/keystone-firmware-test/firmware/k3/fw_dynamic.bin | grep -F '[SM-TRACE]'
      - name: Verify usage and source layout
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/build-install-k3.sh --help
          bash scripts/build-install-keystone.sh --help
          bash scripts/run-k3.sh --help
          bash scripts/clean-k3.sh --help
          for path in qemu/configure opensbi/Makefile keystone/sm/tools/k3_rv64_compile_audit.py linux-k3/Makefile patches/linux-k3-config.patch; do
            test -s "$path" || { echo "Missing $path"; exit 1; }
          done
          test ! -e linux-k3-config.patch
      - name: Verify cleaning is selective and preserves non-build files
        shell: bash
        run: |
          set -Eeuo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          mkdir -p "$TMP/k3-build/qemu" "$TMP/k3-build/firmware" "$TMP/k3-build/linux"
          printf 'k3-build-dir-v1\n' > "$TMP/k3-build/.k3-build-root"
          touch "$TMP/k3-build/qemu/file" "$TMP/k3-build/firmware/file" "$TMP/k3-build/linux/file"
          bash scripts/clean-k3.sh --build-dir "$TMP/k3-build" --only qemu --dry-run
          test -e "$TMP/k3-build/qemu/file"
          bash scripts/clean-k3.sh --build-dir "$TMP/k3-build" --only qemu
          test ! -e "$TMP/k3-build/qemu"
          test -e "$TMP/k3-build/firmware/file"
          test -e "$TMP/k3-build/linux/file"
          bash scripts/clean-k3.sh --build-dir "$TMP/k3-build"
          test ! -e "$TMP/k3-build/firmware"
          test ! -e "$TMP/k3-build/linux"
          mkdir -p "$TMP/unmarked/qemu"
          if bash scripts/clean-k3.sh --build-dir "$TMP/unmarked"; then echo 'Unsafe clean was accepted' >&2; exit 1; fi
