name: Remove superseded K3 source branches
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-source-branches.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify source trees preserved on main and remove old refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          PUBLIC="https://github.com/${GITHUB_REPOSITORY}.git"
          git init -q repo-check
          cd repo-check
          git remote add origin "$PUBLIC"
          git fetch --no-tags --filter=blob:none origin main             refs/heads/sources/qemu-k3:refs/remotes/origin/sources/qemu-k3             refs/heads/sources/opensbi-k3:refs/remotes/origin/sources/opensbi-k3             refs/heads/sources/keystone-k3:refs/remotes/origin/sources/keystone-k3
          for name in qemu opensbi keystone; do
            BRANCH="sources/${name}-k3"
            SUBTREE=$(git rev-parse "FETCH_HEAD:${name}" 2>/dev/null || git rev-parse "origin/main:${name}")
            ORIGINAL=$(git rev-parse "refs/remotes/origin/${BRANCH}^{tree}")
            if [ "$SUBTREE" != "$ORIGINAL" ]; then
              echo "::error::Tree mismatch for $name: $SUBTREE != $ORIGINAL. Refusing deletion."
              exit 1
            fi
            echo "Verified identical trees for $name: $ORIGINAL" >> "$GITHUB_STEP_SUMMARY"
          done
          for name in qemu opensbi keystone; do
            BRANCH="sources/${name}-k3"
            git push "$AUTH" ":refs/heads/${BRANCH}"
            echo "Deleted superseded branch $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          done
